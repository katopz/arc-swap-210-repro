# Load generator only: a moderately heavy, pure-Rust dependency graph whose
# fresh builds produce the concurrent multi-process rustc load the fires needed.
# Nothing here touches arc-swap.
[package]
name = "load"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut", "fold"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rayon = "1"
clap = { version = "4", features = ["derive"] }
image = "0.25"
chrono = "0.4"
hyper = { version = "1", features = ["full"] }
